<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#de3a0d"/>
      <stop offset="100%" style="stop-color:#e17605"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <!-- Softball stitching arcs -->
  <circle cx="32" cy="32" r="22" fill="white" opacity="0.95"/>
  <!-- Left stitch arc -->
  <path d="M18,20 Q14,32 18,44" stroke="#de3a0d" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M21,20 Q17,32 21,44" stroke="#de3a0d" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Right stitch arc -->
  <path d="M46,20 Q50,32 46,44" stroke="#de3a0d" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M43,20 Q47,32 43,44" stroke="#de3a0d" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Horizontal stitch lines left -->
  <line x1="14" y1="27" x2="20" y2="29" stroke="#de3a0d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="32" x2="20" y2="32" stroke="#de3a0d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="37" x2="20" y2="35" stroke="#de3a0d" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Horizontal stitch lines right -->
  <line x1="50" y1="27" x2="44" y2="29" stroke="#de3a0d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="44" y2="32" stroke="#de3a0d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="37" x2="44" y2="35" stroke="#de3a0d" stroke-width="1.5" stroke-linecap="round"/>
</svg>
